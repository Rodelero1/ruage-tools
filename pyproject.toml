[project]
name = "ruage-tools"
version = "0.1.0"
description = "The importer for ruage: the user's Age of Empires II HD .dat files to the engine's content pack"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "binary-file-parser>=0.3.0a15",
    "zlib-ng>=0.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
